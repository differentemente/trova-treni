<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#006633" />
    <!-- il tema segue l'impostazione chiaro/scuro del dispositivo -->
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- carattere a punti per il tabellone partenze -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@800;900&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Trova Treni</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Modulo nascosto: serve a Netlify Forms per riconoscere il modulo
         "suggerimenti" inviato dall'app (schermata Suggerimenti). -->
    <form name="suggerimenti" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="tipo" />
      <textarea name="messaggio"></textarea>
      <input type="email" name="email" />
      <input type="text" name="dispositivo" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
